# pixels dev containers on geekom.
#
# Containers sit on the NAT'd incusbr0 bridge (10.185.22.0/24) and are not
# routable from this laptop, so we hop through geekom. The box has no
# systemd-resolved, so its resolver cannot be taught the .incus zone; instead
# we ask the bridge's dnsmasq directly, which is authoritative for it. That
# keeps container IPs dynamic with no per-container config.
#
# Host keys go in their own file. base-setup.sh gives every clone a fresh host
# key, and container names get recycled, so entries here go stale constantly
# and would otherwise trip "REMOTE HOST IDENTIFICATION HAS CHANGED" against
# the main known_hosts. newbox.sh drops the stale entry on each create.
#
# Do NOT set UserKnownHostsFile=/dev/null here: `herdr machine add` fails with
# "lost connection to server" when host keys are not persisted. It needs a
# real known_hosts, which is why the churn is handled at create time instead.
#
# Agent forwarding is off: these containers run AI coding agents, and
# forwarding the 1Password agent would hand them your private keys. Use a
# scoped deploy key or `gh auth login` inside the container instead.
Host px-*
    User pixel
    ProxyCommand ssh dpeckham@geekom.local 'nc $(dig +short %h.incus @10.185.22.1 | head -n1) 22'
    StrictHostKeyChecking accept-new
    UserKnownHostsFile ~/.ssh/known_hosts.pixels
    ForwardAgent no
